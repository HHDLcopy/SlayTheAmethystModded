name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 需要读取仓库内容来下载依赖
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 🔽 核心：复用原作者的依赖下载逻辑
      - name: Download and verify private build dependency bundle
        shell: bash
        env:
          # 使用原作者公开的依赖仓库和版本
          BUILD_DEPS_REPO: "ModinMobileSTS/SlayTheAmethystModdedDependence"
          BUILD_DEPS_RELEASE_TAG: "v1.5.8"  # 请确认这是最新的有效版本
          BUILD_DEPS_ASSET_NAME: "build-deps.tar.gz"
          # 注意：原作者使用了 SHA256 校验，这里我们跳过校验以简化（因为无法获取公开的 SHA256 值）
          # 如果你能找到正确的 SHA256，可以添加下面的环境变量
          # BUILD_DEPS_SHA256: "这里填入正确的SHA256值"
          GH_TOKEN: ${{ github.token }}
          GH_REPO_CURRENT: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${BUILD_DEPS_RELEASE_TAG:-}" ]; then
            echo "Missing environment variable BUILD_DEPS_RELEASE_TAG." >&2
            exit 1
          fi
          deps_repo="${BUILD_DEPS_REPO:-$GH_REPO_CURRENT}"
          asset_name="${BUILD_DEPS_ASSET_NAME:-build-deps.tar.gz}"
          archive_path="$RUNNER_TEMP/$asset_name"
          
          echo "Downloading dependency bundle from $deps_repo release $BUILD_DEPS_RELEASE_TAG..."
          gh release download "$BUILD_DEPS_RELEASE_TAG" \
            --repo "$deps_repo" \
            --pattern "$asset_name" \
            --dir "$RUNNER_TEMP" \
            --clobber
          
          # 原作者有 SHA256 校验，这里为简化，暂时跳过
          # 如果下载的文件损坏，后续解压或编译会失败
          # 如果你能找到正确的 SHA256，可以取消下面的注释并设置 BUILD_DEPS_SHA256
          # echo "$BUILD_DEPS_SHA256  $archive_path" | sha256sum --check --status
          
          deps_root="$RUNNER_TEMP/build-deps"
          mkdir -p "$deps_root"
          tar -xzf "$archive_path" -C "$deps_root"
          
          # 处理可能的嵌套目录
          if [ -d "$deps_root/build-deps" ]; then
            deps_root="$deps_root/build-deps"
          fi
          
          # 验证关键文件是否存在
          if [ ! -f "$deps_root/steamapps/common/SlayTheSpire/desktop-1.0.jar" ]; then
            echo "Missing desktop jar in dependency bundle: $deps_root/steamapps/common/SlayTheSpire/desktop-1.0.jar" >&2
            exit 1
          fi
          if [ ! -f "$deps_root/runtime-pack/jre8-pojav.zip" ]; then
            echo "Missing runtime pack zip in dependency bundle: $deps_root/runtime-pack/jre8-pojav.zip" >&2
            exit 1
          fi
          
          # 将依赖复制到项目根目录的 build-deps 文件夹
          mkdir -p build-deps
          cp -R "$deps_root/." build-deps/
          
          echo "Dependency bundle successfully prepared."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Debug)
        run: ./gradlew build

      # 🔽 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
