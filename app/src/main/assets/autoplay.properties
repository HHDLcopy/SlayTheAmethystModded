# Autoplay configuration for SlayTheAmethyst
# Place this file in the game directory (same as ModTheSpire.jar)
# or in config/autoplay.properties

# Enable autoplay (set to true to enable)
amethyst.autoplay.enabled=true

# Auto-start new run on game launch
amethyst.autoplay.start_run=true

# Auto-play cards during combat
amethyst.autoplay.play_cards=true

# Auto-end turn when no cards playable
amethyst.autoplay.end_turn=true

# Auto-select combat rewards
amethyst.autoplay.select_reward=true

# Delay between actions (in milliseconds)
amethyst.autoplay.delay_ms=400

# Enable debug logging
amethyst.autoplay.debug=false

# ==================== New Features ====================

# Auto-navigate through dungeon (click proceed buttons, enter rooms)
amethyst.autoplay.auto_navigate=true

# Combat reward selection mode: random/first/attack_only/skip
amethyst.autoplay.reward_selection_mode=random

# Skip event rooms (leave without interacting)
amethyst.autoplay.skip_events=false

# Skip shop rooms
amethyst.autoplay.skip_shops=false

# Skip chest/treasure rooms
amethyst.autoplay.skip_chests=false