[package]
name = "slay-the-amethyst-online"
version = "0.1.0"
edition = "2021"
description = "Windows system tray companion for Slay the Amethyst EasyTier rooms"
license = "MIT"

[dependencies]
arboard = "3.6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
rfd = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tray-icon = "0.24"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }
winit = "0.30"
