services:
  presence-service:
    image: ghcr.io/modinmobilests/slaytheamethyst-presence-service:latest
    container_name: sts-presence-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      PUBLIC_BASE_URL: http://localhost:3001
      PRESENCE_DB_PATH: /app/data/presence.sqlite
      PRESENCE_HEARTBEAT_INTERVAL_SECONDS: 30
      PRESENCE_OFFLINE_TIMEOUT_SECONDS: 90
      PRESENCE_PANEL_TOKEN: change-me
      LOG_LEVEL: info
    volumes:
      - presence-data:/app/data

volumes:
  presence-data:
